name: GCP Authentication Test

on:
  push:
    branches:
      - main  # mainブランチに変更がプッシュされた時に実行されます

jobs:
  auth-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write' # OIDC連携で必須の権限です

    steps:
      # 1. リポジトリのコードを取得
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Google Cloudへ認証（ここでパスワードなしの安全な連携が行われます）
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/1026741002985/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-actions-sa@project-441c5551-1bc3-40df-b9d.iam.gserviceaccount.com

      # 3. gcloudコマンドのセットアップ
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # 4. 連携テスト（現在選択されているGCPプロジェクトの情報を表示）
      - name: Test gcloud command
        run: gcloud info
