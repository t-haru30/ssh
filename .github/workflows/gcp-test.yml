name: GCP Authentication Test

on:
  push:
    branches:
      - main  # mainブランチに変更がプッシュされた時に実行されます
  workflow_dispatch:

jobs:
  auth-and-test:
    if: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && vars.GCP_SERVICE_ACCOUNT != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write' # OIDC連携で必須の権限です

    steps:
      # 1. リポジトリのコードを取得
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Google Cloudへ認証（ここでパスワードなしの安全な連携が行われます）
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      # 3. gcloudコマンドのセットアップ
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # 4. 連携テスト（現在選択されているGCPプロジェクトの情報を表示）
      - name: Test gcloud command
        run: gcloud info
